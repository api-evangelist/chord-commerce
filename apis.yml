apis:
  - name: Chord MCP
    description: >-
      Chord's hosted Model Context Protocol server — a remote, OAuth-protected,
      read-only window into a customer's Chord data warehouse. Fourteen
      documented tools cover schema search, saved views, prior question/SQL
      pairs, org SQL conventions, table preview, read-only SQL execution,
      activation/sync health, and multi-tenant routing across the Chord
      organizations the authenticated user belongs to. Registered in Claude via
      Custom Connectors, via Chord's own Claude Code plugin, or through the
      mcp-remote bridge; tools/list is auth-gated behind OAuth 2.1 with PKCE and
      dynamic client registration against Chord's Stytch-backed authorization
      server.
    humanURL: https://docs.chord.co/chord-mcp
    baseURL: https://mcp.chord.co/mcp
    tags:
      - MCP
      - AI Agents
      - Commerce Analytics
      - Data Warehouse
    properties:
      - type: MCPServer
        url: mcp/chord-commerce-mcp.yml
      - type: Documentation
        url: https://docs.chord.co/chord-mcp
      - type: OAuthScopes
        url: scopes/chord-commerce-scopes.yml
      - type: WellKnown
        url: well-known/chord-commerce-well-known.yml
      - type: SourceCode
        url: https://github.com/chordcommerce/chord-copilot
  - name: Chord CDP Ingest API
    description: >-
      The HTTP ingest surface of the Chord customer data platform. Backend
      systems POST track and identify events to /api/track and /api/identify,
      authenticated with a per-source write key (X-Write-Key header preferred).
      Chord publishes a full canonical event catalog — order, shipment,
      subscription and user server events plus a browser tracking plan — and
      documents its delivery semantics unusually thoroughly: at-least-once
      delivery, a stable messageId carried end to end, exponential-backoff
      retries and a dead-letter queue. Ingest is deliberately permissive: the
      tracking plan is a convention, not a schema validator, and custom events
      pass through unmodified.
    humanURL: https://docs.chord.co/server-events-overview
    baseURL: https://production.cdp.ingest.chord.co
    tags:
      - Event Tracking
      - CDP
      - Customer Data Platform
      - Events
    properties:
      - type: Documentation
        url: https://docs.chord.co/server-events-overview
      - type: Webhooks
        url: asyncapi/chord-commerce-events.yml
      - type: Authentication
        url: authentication/chord-commerce-authentication.yml
      - type: ErrorCatalog
        url: errors/chord-commerce-error-codes.yml
  - name: Chord Audiences API
    description: >-
      Read API for activated audiences. Once the Dynamic Audiences API
      destination is enabled on an account, a sync mirrors a custom audience into
      the API and a server-side GET on /audiences returns that user's audience
      memberships with their attached attributes. Keyed by the CDP Blended User
      ID passed in the Chord-User-Id header and authenticated with a bearer token
      issued by Chord. Intended for on-site personalization; Chord's docs state
      it must always be called server-side.
    humanURL: https://docs.chord.co/audiences-api
    baseURL: https://analytics.api.chord.co
    tags:
      - Audiences
      - Personalization
      - CDP
    properties:
      - type: Documentation
        url: https://docs.chord.co/audiences-api
      - type: Authentication
        url: authentication/chord-commerce-authentication.yml
      - type: ErrorCatalog
        url: errors/chord-commerce-error-codes.yml
