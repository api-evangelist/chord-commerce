aid: chord-commerce
name: Chord
description: >-
  Chord is a New York / Santa Barbara-based commerce data and AI platform
  founded in 2021 by Bryan Mahoney (CEO) and Henry Davis (President &
  Chairman), both former Glossier executives. Chord began as a headless
  commerce backbone built on top of Solidus — the open-source Spree
  Commerce fork written in Ruby on Rails — and has since evolved into an
  AI-native commerce data platform with three layers: a Data Foundation
  that unifies sources such as Shopify, ad platforms, and CDPs; a Context
  Stack that grounds AI in store-specific business context; and a set of
  Agents that take action across the commerce stack. Its current
  product surface includes Chord OMS (a Solidus-based order management
  system covering orders, products, promotions, subscriptions,
  affiliates, gift cards, returns, shipping, tax, and digital products
  documented at chord.stoplight.io), Chord CDP (customer data platform
  with identity resolution, RFM scoring, customer lifetime revenue, and
  destination activations), Chord Event Tracking (client- and
  server-side eventing with Shopify Web Pixel integration and consent
  management via OneTrust and Shopify Customer Privacy API), Chord Data
  Platform (analytics, predictive modeling, attribution, recommendations,
  Fivetran ingestion, GA4 compatibility), and Chord AI / Copilot Chat,
  powered by Anthropic Claude (Opus 4.5 for SQL generation, Haiku 4.5
  for response generation and classification) with charts, monitors,
  context modeling, and natural-language data querying. Chord's GitHub
  org (github.com/chordcommerce) maintains a fleet of Solidus extensions
  (solidus_stripe, solidus_braintree, solidus_paypal_braintree,
  solidus_subscriptions, solidus_virtual_gift_card, solidus_importer,
  solidus_avatax_certified), a consent-manager TypeScript library, a
  Jitsu fork for event ingestion, and example repos for eventing and
  analytics. Notable customers include Sonos, Blue Bottle Coffee, Rodan
  + Fields, MrBeast, and Ritual. Funding has come from M13 Ventures,
  Equal Ventures, Act One Ventures, Chingona Ventures, and CEAS
  Investments, with an $18M Series A reported by TechCrunch in 2021.
  The commercial model is sales-led with custom enterprise pricing
  gated behind a demo request.
