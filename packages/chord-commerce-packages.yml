method: searched
source: >-
  registry.npmjs.org, rubygems.org/api/v1, docs.chord.co/analytics-developer-docs,
  github.com/chordcommerce
note: >-
  Chord ships exactly one first-party client library on a public registry:
  @chordcommerce/analytics, the browser event-tracking SDK. It is actively
  maintained (v1.23.1, 2026-08-10). Everything else in the chordcommerce GitHub
  org is either a FORK of an upstream Solidus/Jitsu/Segment project — the gems
  (solidus_subscriptions, solidus_virtual_gift_card, solidus_importer,
  solidus_stripe, solidus_braintree, solidus_avatax_certified) are published by
  solidusio / nebulab, NOT by Chord, so they are recorded as forks and not
  claimed as Chord packages — or an archived internal repo. There is no Python,
  Ruby, Go, Java, .NET, PHP or Rust client for any Chord API.
packages:
  - language: javascript
    registry: npm
    name: '@chordcommerce/analytics'
    url: https://www.npmjs.com/package/@chordcommerce/analytics
    install: npm install @chordcommerce/analytics
    official: true
    version: 1.23.1
    published: '2026-08-10'
    description: Chord Commerce event tracking
    docs: https://docs.chord.co/analytics-developer-docs
    api_reference: https://docs.chord.co/sdk-api-reference
    changelog: https://docs.chord.co/chordcommerceanalytics
    note: >-
      Browser SDK. Wraps a CDP tracking library (Segment analytics.js is the only
      supported host) and emits Chord's canonical tracking-plan events. Exposes
      window.chord once loaded. Registry metadata read from
      registry.npmjs.org/@chordcommerce%2Fanalytics on 2026-08-13.
  - language: javascript
    registry: cdn
    name: analytics-liquid-identifiers
    url: https://cdn.chord.co/analytics-liquid-identifiers/v1/analytics-liquid-identifiers.min.js
    official: true
    version: null
    published: null
    note: >-
      CDN-distributed browser script used in Shopify Liquid themes to persist
      browser identifiers onto the cart/order so server events can be joined to
      front-end sessions. The URL pins only a MAJOR line (/v1/), not a release,
      so it floats to whatever Chord last published — a consumer cannot tell what
      build they are loading, and neither can this pipeline. No npm/jsDelivr/unpkg
      metadata endpoint exists for it. version: null is a checked gap, not an
      unchecked field.
