method: probed
source: live GET of /.well-known/* on every Chord host named in apis.yml and in the docs
note: 'Chord serves a real /.well-known/ discovery surface, but only on the MCP and auth hosts. The marketing
  site (chordcommerce.com), the Archbee docs host (docs.chord.co) and the Heroku-fronted app hosts return
  HTML or empty 404s for every path. The three 200s below are genuine machine-readable documents: the
  RFC 9728 protected-resource metadata that mcp.chord.co advertises in its WWW-Authenticate challenge,
  the RFC 8414 authorization-server metadata, and the OIDC discovery document served by Chord''s white-labelled
  Stytch host (api.stytch.chord.co, a Chord-controlled subdomain of chord.co).


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
hosts:
- host: https://mcp.chord.co
  documents:
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    file: chord-commerce-mcp-oauth-protected-resource.json
  - path: /.well-known/oauth-protected-resource/mcp
    status: 200
    content_type: application/json
    note: The exact resource_metadata URL named in the 401 WWW-Authenticate header returned by POST https://mcp.chord.co/mcp.
      Body is identical to the parent path, so it is not duplicated on disk.
