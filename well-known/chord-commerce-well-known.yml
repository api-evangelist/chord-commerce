security_txt:
  served: false
  note: No RFC 9116 security.txt on any Chord host. Chord publishes a Security Measures addendum at chordcommerce.com/legal/security-measures,
    but it names no reporting address, no disclosure policy and no bug bounty, so it is not a vulnerability
    disclosure surface.
agent_card:
